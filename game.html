<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081748">
  <title>Division — Game</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&display=swap" rel="stylesheet">
  <script>tailwind.config={theme:{extend:{colors:{navy:'#081748',mint:'#72F2DC',paper:'#F3FBF7',line:'#BACAC3'},fontFamily:{display:['Fredoka','sans-serif'],body:['Varela Round','sans-serif']}}}};</script>
</head>
<body class="min-h-screen bg-paper text-navy font-body">
  <header class="sticky top-0 z-20 border-b border-line/60 bg-white/90 backdrop-blur">
    <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
      <a href="index.html" class="flex items-center gap-2 font-display text-xl font-semibold"><span class="flex h-9 w-9 flex-col items-center justify-center gap-[2px] rounded-[7px] bg-navy shadow-sm" aria-hidden="true"><span class="flex h-[15px] w-[18px] items-center justify-center gap-[3px] rounded-[5px] bg-mint"><span class="h-[5px] w-[4px] rounded-full bg-navy"></span><span class="h-[5px] w-[4px] rounded-full bg-navy"></span></span><span class="h-[5px] w-[12px] rounded-b-full border-b-2 border-mint"></span></span><span>DIVISION</span></a>
      <div class="flex items-center gap-4 text-sm">
        <a href="index.html#games" class="hover:underline">Explore games</a>
        <a href="profile.html" class="flex items-center gap-2 font-semibold">
          <img src="assets/icons/avatar.svg" alt="Profile avatar" class="h-8 w-8 rounded-full object-cover">
          <span>My Profile</span>
        </a>
      </div>
    </nav>
  </header>
  <main class="mx-auto max-w-6xl space-y-6 px-4 py-8">
    <a href="index.html#games" class="inline-flex items-center gap-2 text-sm font-semibold hover:underline">← Back to games</a>
    <section class="overflow-hidden rounded-3xl border border-line/60 bg-white shadow-sm">
      <div class="relative aspect-video min-h-64 bg-navy">
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-4 p-6 text-center text-white">
          <p class="text-sm text-white/70">Ready when you are</p>
          <button type="button" class="rounded-full bg-mint px-7 py-3 font-semibold text-navy shadow-lg hover:brightness-95">Play Now</button>
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-4 p-5">
        <div>
          <h1 class="font-display text-3xl font-semibold">Loading game…</h1>
          <p class="mt-2 max-w-2xl text-sm text-slate-600">Loading game details from Division.</p>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" data-like aria-label="Like game" class="rounded-full bg-navy px-4 py-2.5 text-sm font-semibold text-white">Like</button>
          <button type="button" data-fav aria-label="Save to Favourites" class="rounded-full border border-line px-4 py-2.5 text-sm font-semibold">Save</button>
          <button type="button" data-fullscreen aria-label="Fullscreen" class="rounded-full border border-line px-4 py-2.5 text-sm font-semibold">Fullscreen</button>
        </div>
      </div>
    </section>
    <section class="rounded-3xl border border-line/60 bg-white p-6">
      <h2 class="font-display text-2xl font-semibold">About this game</h2>
      <p data-game-description class="mt-2 text-sm text-slate-600">Loading game details from Division.</p>
    </section>
  

</main>
  <footer class="mt-10 bg-navy px-4 py-8 text-center text-sm text-white/80">
    <a href="index.html" class="font-display text-lg font-semibold text-white">DIVISION</a>
    <p class="mt-1">Let the world play.</p>
  </footer>
  <script type="module" src="assets/script/design-pages.js?v=20261126-finalfix></script>
  <script type="module" src="assets/script/app-settings.js"></script>
</body>
</html>
