<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>My Division — Profile</title><link rel="stylesheet" href="assets/style/style.css"><link rel="stylesheet" href="assets/style/profile.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-symbol">÷</span><span>DIVISION</span></a><nav class="main-nav"><a href="index.html#discover">Discover</a><a href="index.html#categories">Categories</a><a class="active" href="profile.html">My games</a></nav><div class="top-actions"><button class="icon-button" id="logout-button">↗</button></div></header><main class="profile-page"><section class="profile-hero"><div class="profile-avatar-wrap"><img id="profile-avatar" alt="Profile picture" src="assets/icons/avatar.svg"><label class="avatar-change" for="avatar-file">+</label><input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp" hidden></div><div class="profile-heading"><span class="eyebrow">YOUR DIVISION</span><h1 id="profile-name">Player</h1><p id="profile-bio">Your gaming profile.</p><button class="button button-ghost" id="edit-profile-button">Edit profile</button></div></section><section class="profile-edit-panel" id="edit-panel" hidden><form id="profile-form"><label>Username<input id="edit-username" maxlength="24" required></label><div class="profile-name-fields"><label>First name<input id="edit-first" maxlength="40"></label><label>Last name<input id="edit-last" maxlength="40"></label></div><label>Bio<textarea id="edit-bio" maxlength="180" rows="3"></textarea></label><div class="profile-form-actions"><button class="button button-accent" type="submit">Save profile</button><button class="button button-ghost" id="cancel-edit" type="button">Cancel</button></div></form></section><section class="profile-library"><div class="section-heading"><div><span class="eyebrow">YOUR COLLECTION</span><h2>Saved games
