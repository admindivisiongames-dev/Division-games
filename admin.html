<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Admin — Division</title><link rel='stylesheet' href='assets/style/style.css'><link rel='stylesheet' href='assets/style/pages.css'></head><body><header class='site-header'><a class='brand' href='index.html'>÷ DIVISION ADMIN</a><a href='index.html'>View site</a></header><main class='page-shell'><h1>Game management</h1><p>Admin role required. Add real games and delete starter demo entries.</p><div id='gate' class='notice-card'>Checking permissions…</div><section id='panel' hidden><form id='gameForm' class='admin-form'><h2>Add / edit game</h2><input id='old' type='hidden'><label>Title<input id='title' required></label><label>Game ID<input id='id' pattern='[a-z0-9-]+' required></label><label>Category<input id='category' required></label><label>Description<textarea id='description'></textarea></label><label>Instructions<textarea id='instructions'></textarea></label><label>Playable URL<input id='url' type='url'></label><label>Symbol<input id='symbol' value='✦'></label><label>Cover class<select id='cover'><option>cover-1</option><option>cover-2</option><option>cover-3</option><option>cover-4</option><option>cover-5</option><option>cover-6</option></select></label><label><input type='checkbox' id='demo' checked> Demo game</label><button class='button button-dark'>Save game</button><button type='button' id='clear'>Clear</button><p id='msg'></p></form><h2>Games</h2><div id='list'></div></section></main><script type='module' src='assets/script/admin.js'></script></body></html>
