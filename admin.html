<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10110f"><title>Division Admin</title><link rel="stylesheet" href="assets/style/style.css"><link rel="stylesheet" href="assets/style/admin.css"></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-symbol">÷</span><span>DIVISION</span></a><nav class="main-nav"><a href="index.html">View site</a><a class="active" href="admin.html">Admin</a></nav><div class="top-actions"><button class="icon-button" id="admin-logout">↗</button></div></header><main class="admin-page"><div class="admin-title"><div><span class="eyebrow">DIVISION CONTROL ROOM</span><h1>Game manager</h1><p>Add, edit, publish and remove games from the arcade.</p></div><button class="button button-accent" id="new-game-button">+ Add game</button></div><section class="admin-editor" id="editor" hidden><div class="section-heading"><div><span class="eyebrow">GAME DETAILS</span><h2 id="editor-title">Add a game</h2></div><button class="icon-button" id="close-editor" type="button">×</button></div><form id="game-form"><input type="hidden" id="game-id"><div class="admin-fields"><label>Game title<input id="title" required maxlength="100"></label><label>Game ID<input id="slug" required maxlength="100" placeholder="auto-from-title"></label><label>Category<select id="category"><option>action</option><option>driving</option><option>shooting</option><option>adventure</option><option>racing</option><option>simulation</option><option>multiplayer</option></select></label><label>Game link (URL)<input id="game-url" type="url" required placeholder="https://…"></label><label>Cover image URL<input id="image-url" type="url" placeholder="https://…"></label><label>Cover colour<input id="cover-color" value="#292a24" maxlength="24"></label><label>Card symbol<input id="symbol" value="÷" maxlength="4"></label><label>Tags (comma separated)<input id="tags" placeholder="arcade, fun"></label><label class="full">Description<textarea id="description" rows="3" maxlength="500"></textarea></label><label class="full">Instructions<textarea id="instructions" rows="3"></textarea></label></div><div class="admin-checks"><label><input type="checkbox" id="published" checked> Published</label><label><input type="checkbox" id="featured"> Featured</label><label><input type="checkbox" id="popular"> Popular</label><label><input type="checkbox" id="recommended"> Recommended</label><label><input type="checkbox" id="multiplayer"> Multiplayer</label></div><div class="admin-form-actions"><button class="button button-accent" type="submit" id="save-game">Save game</button><button class="button button-ghost" type="button" id="cancel-game">Cancel</button><span id="admin-message" aria-live="polite"></span></div></form></section><section class="admin-list-section"><div class="section-heading"><div><span class="eyebrow">ARCADE INVENTORY</span><h2>Games <span class="title-count" id="admin-count">0</span></h2></div><input class="admin-search" id="admin-search" placeholder="Find a game…" type="search"></div><div id="admin-games" class="admin-games"><div class="loading-state"><span class="loader"></span></div></div></section></main><script type="module" src="assets/script/admin-core.js?v=clean1"></script></body></html>
