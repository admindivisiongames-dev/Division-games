<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Astro Bounce — Division</title><style>
*{box-sizing:border-box}body{margin:0;background:#07132f;color:#effffb;font:16px system-ui,sans-serif;display:flex;min-height:100vh;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:12px;border-bottom:1px solid #26375a}a{color:#72f2dc;text-decoration:none;font-weight:700}.brand{font-weight:900;letter-spacing:1.5px}.wrap{width:min(900px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.score{font-weight:800;color:#ffe44d}.canvas-box{position:relative;border:2px solid #72f2dc;border-radius:18px;overflow:hidden;background:#050b1c;box-shadow:0 12px 50px #0007}canvas{display:block;width:100%;height:auto;touch-action:none}.overlay{position:absolute;inset:0;background:#06102bd9;display:grid;place-content:center;text-align:center;padding:20px}.overlay h1{font-size:clamp(28px,6vw,48px);margin:0 0 8px}.overlay p{color:#b9c9e8;max-width:450px;line-height:1.5}.btn{border:0;background:#72f2dc;color:#07132f;padding:13px 22px;border-radius:999px;font-weight:900;font-size:16px;cursor:pointer}.help{text-align:center;color:#b9c9e8;font-size:13px;margin:14px 0}.touch{display:flex;justify-content:center;gap:18px;margin:10px auto}.touch button{width:68px;height:52px;border:1px solid #72f2dc;background:#102248;color:#fff;border-radius:14px;font-size:24px;touch-action:none}@media(min-width:700px){.touch{display:none}}
</style></head><body><header><a class="brand" href="../index.html">÷ DIVISION</a><a href="../index.html#games">← All games</a></header><main class="wrap"><div class="top"><strong>ASTRO BOUNCE</strong><span class="score">Score: <span id="score">0</span> · Best: <span id="best">0</span></span></div><div class="canvas-box"><canvas id="game" width="800" height="500" aria-label="Astro Bounce arcade game"></canvas><div class="overlay" id="overlay"><h1>Astro Bounce</h1><p>Keep your space ball bouncing, collect stars and dodge the falling meteors. Move with ← → or A / D. On touchscreens, use the buttons below.</p><button class="btn" id="start">Start game</button></div></div><div class="touch"><button id="left" aria-label="Move left">←</button><button id="right" aria-label="Move right">→</button></div><p class="help">Move: ← → or A / D · Pause: P · Restart after game over</p></main><script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),start=document.querySelector('#start'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best');let running=false,score=0,best=0,frame=0,keys={},player={x:400,y:420,r:16,vx:0},stars=[],rocks=[],last=0,raf;try{best=Number(sessionStorage.getItem('astroBest')||0)}catch{}bestEl.textContent=best;
function reset(){score=0;frame=0;player.x=400;player.vx=0;stars=[];rocks=[];scoreEl.textContent=0}
function startGame(){cancelAnimationFrame(raf);reset();running=true;overlay.style.display='none';last=performance.now();raf=requestAnimationFrame(loop)}
function endGame(){running=false;overlay.style.display='grid';overlay.innerHTML='<h1>Game over</h1><p>You scored <b>'+score+'</b>. Try to beat your best!</p><button class="btn" id="restart">Play again</button>';document.querySelector('#restart').onclick=startGame}
function draw(){ctx.clearRect(0,0,800,500);ctx.fillStyle='#050b1c';ctx.fillRect(0,0,800,500);for(let i=0;i<90;i++){let x=(i*97)%800,y=(i*61+frame*.25)%500;ctx.fillStyle=i%5===0?'#72f2dc':'#62749d';ctx.globalAlpha=.35+(i%5)*.12;ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;ctx.fillStyle='#182b53';ctx.fillRect(0,470,800,30);ctx.fillStyle='#72f2dc';ctx.fillRect(0,470,800,3);
for(const s of stars){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(frame*.04);ctx.fillStyle='#ffe44d';ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5,r=i%2?7:14;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
for(const r of rocks){ctx.fillStyle='#f48b66';ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffcf9e';ctx.beginPath();ctx.arc(r.x-r.r*.3,r.y-r.r*.25,r.r*.25,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#72f2dc';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#07132f';ctx.beginPath();ctx.arc(player.x+5,player.y-3,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#b8fff2';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,player.r+3,0,Math.PI*2);ctx.stroke()}
function loop(now){if(!running)return;let dt=Math.min((now-last)/16.67,2);last=now;frame+=dt;player.vx=(keys.ArrowLeft||keys.a?-5:0)+(keys.ArrowRight||keys.d?5:0);player.x=Math.max(player.r,Math.min(800-player.r,player.x+player.vx*dt));if(frame%Math.max(18,48-score*.1)<dt){stars.push({x:25+Math.random()*750,y:-20,r:12});if(Math.random()<.65)rocks.push({x:25+Math.random()*750,y:-20,r:12+Math.random()*10,v:2+Math.random()*1.5+score*.015})}
for(let i=stars.length-1;i>=0;i--){let s=stars[i];s.y+=(3+score*.01)*dt;if(Math.hypot(s.x-player.x,s.y-player.y)<s.r+player.r){stars.splice(i,1);score+=10;scoreEl.textContent=score}}
for(let i=rocks.length-1;i>=0;i--){let r=rocks[i];r.y+=r.v*dt;if(Math.hypot(r.x-player.x,r.y-player.y)<r.r+player.r){endGame();draw();return}if(r.y>520)rocks.splice(i,1)}
draw();raf=requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='p'&&running){running=false;overlay.style.display='grid';overlay.innerHTML='<h1>Paused</h1><p>Take a breather.</p><button class="btn" id="resume">Resume</button>';document.querySelector('#resume').onclick=()=>{running=true;last=performance.now();raf=requestAnimationFrame(loop)}}});window.addEventListener('keyup',e=>{keys[e.key]=false;keys[e.key.toLowerCase()]=false});function hold(id,key){let b=document.querySelector(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>keys[key]=false))}hold('#left','ArrowLeft');hold('#right','ArrowRight');start.onclick=startGame;draw()})();
</script></body></html>
